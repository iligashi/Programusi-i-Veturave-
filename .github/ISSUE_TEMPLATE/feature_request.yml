name: Feature or content request
description: Suggest a new feature, a new service or a text change
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: Who benefits, and how?
