name: Bug report
description: Something on the website is broken or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://programuesiiveturave.netlify.app/services
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [Phone, Tablet, Desktop]
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Safari 18 on iOS
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
